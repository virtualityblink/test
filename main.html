<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/main.css">
    <title>hours</title>
</head>

<body>
    <div id="main">
        <div id="menuDate">
            <div id="menuYear">
                <div id="currentYearValue">2026</div>
                <div id="listYears">
                    <div class="itemYear">2026</div>
                </div>
            </div>
            <div id="menuMonth">
                <div id="currentMonthValue">Листопад</div>
                <div id="listMonths">
                    <div class="itemMonth">Січень</div>
                    <div class="itemMonth">Лютий</div>
                    <div class="itemMonth">Березень</div>
                    <div class="itemMonth">Квітень</div>
                    <div class="itemMonth">Травень</div>
                    <div class="itemMonth">Червень</div>
                    <div class="itemMonth">Липень</div>
                    <div class="itemMonth">Серпень</div>
                    <div class="itemMonth">Вересень</div>
                    <div class="itemMonth">Жовтень</div>
                    <div class="itemMonth">Листопад</div>
                    <div class="itemMonth">Грудень</div>
                </div>
            </div>
        </div>
        <div id="stats">
            <div id="statsDays">
                <div id="statsDaysDesc">Робочі дні</div>
                <div id="statsDaysValue">0</div>
            </div>
            <div id="statsHours">
                <div id="statsHoursDesc">Робочі години</div>
                <div id="statsHoursValue">0</div>
            </div>
            <div id="statsFunds">
                <div id="statsFundsDesc">Кошти</div>
                <div id="statsFundsValue">0</div>
            </div>
        </div>
        <div id="content">
            <div id="listDaysTitles">
                <div class="titleDate">Дата</div>
                <div class="titleHours">Години</div>
                <div class="titleFunds">Кошти</div>
            </div>
            <div id="listDays">
                <div class="itemDay">
                    <div class="itemDayDate">20.11.2026</div>
                    <div class="itemDayHours">8</div>
                    <div class="itemDayFunds">200</div>
                    <div class="buttonItemEdit">Редагувати</div>
                    <div class="buttonItemDelete">Видалити</div>
                </div>
            </div>
            <div id="boxForEditing">
                <input type="text" id="editItemDayHours" placeholder="Години">
                <div id="buttonsEdit">
                    <div id="buttonSaveEdit">Зберегти</div>
                    <div id="buttonCancelEdit">Скасувати</div>
                </div>
            </div>
        </div>
        <div id="newDay">
            <input type="text" id="newDayDay" placeholder="День">
            <input type="text" id="newDayHours" placeholder="Години">
            <div id="createDay">Додати</div>
        </div>
    </div>

    <!-- <script src="js/main.js"></script> -->
</body>

</html>
